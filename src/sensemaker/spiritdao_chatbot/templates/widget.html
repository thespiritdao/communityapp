<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensemaker AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* SpiritDAO Sacred Minimalism Design System
           Primary (Dark Ritual Green): #2F5D50
           Secondary (Muted Sage):      #8FAAA1
           Background (Earthy):         #f5f4ed
           Text (Deep Forest):          #1F2D2A
           Text on dark:                #FFFFFF
        */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 100%;
            margin: 0 auto;
            background: white;
        }

        /* Header — primary green, white text */
        .chat-header {
            background: #2F5D50;
            color: #FFFFFF;
            padding: 20px;
            text-align: center;
            font-weight: 600;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f4ed;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        /* User message — earthy off-white, dark text */
        .message.user .message-content {
            background: #EAF0EE;
            color: #1F2D2A;
            border: 1px solid rgba(47, 93, 80, 0.15);
            border-bottom-right-radius: 4px;
        }

        /* Assistant message — white with subtle sage border */
        .message.assistant .message-content {
            background: white;
            color: #1F2D2A;
            border: 1px solid rgba(47, 93, 80, 0.15);
            border-bottom-left-radius: 4px;
            text-align: left;
            line-height: 1.6;
        }

        /* Markdown formatting */
        .message.assistant .message-content strong {
            font-weight: 700;
            color: #1F2D2A;
        }

        .message.assistant .message-content em {
            font-style: italic;
        }

        .message.assistant .message-content p {
            margin-bottom: 12px;
        }

        .message.assistant .message-content ul,
        .message.assistant .message-content ol {
            margin-left: 20px;
            margin-bottom: 12px;
        }

        .message.assistant .message-content li {
            margin-bottom: 6px;
        }

        .message.assistant .message-content code {
            background: rgba(47, 93, 80, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .message.assistant .message-content blockquote {
            border-left: 3px solid #2F5D50;
            padding-left: 16px;
            margin: 12px 0;
            color: #4a5568;
            font-style: italic;
        }

        .message.assistant .message-content a {
            color: #2F5D50;
            text-decoration: underline;
        }

        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message.assistant:hover .message-actions {
            opacity: 1;
        }

        .action-button {
            padding: 6px 12px;
            background: white;
            border: 1px solid rgba(47, 93, 80, 0.2);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: #1F2D2A;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .action-button:hover {
            background: #EAF0EE;
            border-color: #2F5D50;
            color: #2F5D50;
        }

        .action-button.success {
            background: rgba(47, 93, 80, 0.1);
            border-color: #2F5D50;
            color: #2F5D50;
        }

        /* Mic button — secondary sage */
        .mic-button {
            padding: 10px;
            background: white;
            color: #2F5D50;
            border: 2px solid rgba(47, 93, 80, 0.2);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-button:hover {
            border-color: #8FAAA1;
            background: #EAF0EE;
        }

        .mic-button.listening {
            background: #8FAAA1;
            border-color: #6F8F86;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .loading {
            display: inline-block;
            padding: 12px 16px;
            background: white;
            border: 1px solid rgba(47, 93, 80, 0.15);
            border-radius: 12px;
            color: #8FAAA1;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .chat-input-container {
            border-top: 2px solid rgba(47, 93, 80, 0.1);
            padding: 15px 20px;
            background: white;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid rgba(47, 93, 80, 0.15);
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            color: #1F2D2A;
        }

        .chat-input:focus {
            border-color: #2F5D50;
            box-shadow: 0 0 0 3px rgba(47, 93, 80, 0.12);
        }

        /* Send button — primary green */
        .send-button {
            padding: 12px 24px;
            background: #2F5D50;
            color: #FFFFFF;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            font-size: 15px;
        }

        .send-button:hover {
            background: #254A40;
            box-shadow: 0 4px 12px rgba(47, 93, 80, 0.3);
        }

        .send-button:disabled {
            background: #8FAAA1;
            cursor: not-allowed;
            box-shadow: none;
        }

        .welcome-message {
            text-align: center;
            color: #8FAAA1;
            padding: 40px 20px;
        }

        .welcome-message h2 {
            color: #2F5D50;
            margin-bottom: 10px;
        }

        /* Starter questions — secondary sage outline */
        .starter-questions {
            padding: 12px 20px;
            background: white;
            border-top: 1px solid rgba(47, 93, 80, 0.1);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .starter-question {
            padding: 8px 14px;
            background: white;
            border: 1.5px solid #8FAAA1;
            border-radius: 20px;
            color: #2F5D50;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            white-space: nowrap;
            text-align: right;
        }

        .starter-question:hover {
            background: #2F5D50;
            border-color: #2F5D50;
            color: #FFFFFF;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(47, 93, 80, 0.2);
        }

        .error-message {
            background: rgba(139, 58, 58, 0.08);
            color: #8B3A3A;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #8B3A3A;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .message-content {
                max-width: 90%;
                font-size: 14px;
            }

            .chat-messages {
                padding: 15px 12px;
            }

            .chat-input-container {
                padding: 12px;
                gap: 8px;
            }

            .chat-header {
                font-size: 16px;
                padding: 15px 12px;
            }

            .mic-button {
                width: 40px;
                height: 40px;
                min-width: 40px;
            }

            .send-button {
                padding: 12px 20px;
                min-width: 70px;
            }

            .chat-input {
                font-size: 16px; /* Prevents zoom on iOS */
                padding: 12px 14px;
            }

            .message-actions {
                opacity: 1;  /* Always show on mobile */
                flex-wrap: wrap;
            }

            .action-button {
                font-size: 11px;
                padding: 5px 10px;
            }

            .starter-questions {
                padding: 10px 12px;
                gap: 6px;
            }

            .starter-question {
                font-size: 12px;
                padding: 7px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <i data-lucide="compass" style="width: 24px; height: 24px;"></i>
            <span>Sensemaker AI</span>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <h2>Welcome to Sensemaker AI</h2>
                <p>Ask me about Temporal Naturalism, the Eight Dignities, or the works of Unger, Smolin, and Rivers.</p>
            </div>
        </div>

        <div class="starter-questions" id="starterQuestions">
            <div class="starter-question" onclick="sendStarterQuestion('What is Temporal Naturalism?')">
                What is Temporal Naturalism?
            </div>
            <div class="starter-question" onclick="sendStarterQuestion('What are the Eight Dignities?')">
                What are the Eight Dignities?
            </div>
            <div class="starter-question" onclick="sendStarterQuestion('REFRAME Courage Values')">
                REFRAME Courage Values
            </div>
        </div>

        <div class="chat-input-container">
            <input
                type="text"
                id="chatInput"
                class="chat-input"
                placeholder="What is Temporal Naturalism?"
                onkeypress="handleKeyPress(event)"
            />
            <button class="mic-button" id="micButton" onclick="toggleVoiceInput()" title="Voice input">
                <i data-lucide="mic" id="micIcon" style="width: 20px; height: 20px;"></i>
            </button>
            <button class="send-button" id="sendButton" onclick="sendMessage()">
                <i data-lucide="send" style="width: 18px; height: 18px;"></i>
            </button>
        </div>
    </div>

    <script>
        const API_ENDPOINT = '/api/chat';
        let isLoading = false;
        let sessionId = null;

        function addMessage(content, isUser = false) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            // Use markdown rendering for assistant messages
            if (!isUser && typeof marked !== 'undefined') {
                contentDiv.innerHTML = marked.parse(content);

                // Add action buttons for assistant messages
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';

                // Copy button
                const copyBtn = document.createElement('button');
                copyBtn.className = 'action-button';
                copyBtn.innerHTML = '<i data-lucide="copy" style="width: 14px; height: 14px;"></i> Copy';
                copyBtn.onclick = () => copyMessage(content, copyBtn);
                actionsDiv.appendChild(copyBtn);

                // Share button
                const shareBtn = document.createElement('button');
                shareBtn.className = 'action-button';
                shareBtn.innerHTML = '<i data-lucide="share-2" style="width: 14px; height: 14px;"></i> Share';
                shareBtn.onclick = () => shareMessage(content);
                actionsDiv.appendChild(shareBtn);

                // Initialize Lucide icons for these buttons
                if (typeof lucide !== 'undefined') {
                    setTimeout(() => lucide.createIcons(), 0);
                }

                contentDiv.appendChild(actionsDiv);
            } else {
                contentDiv.textContent = content;
            }

            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);

            // Remove welcome message if present
            const welcomeMsg = messagesContainer.querySelector('.welcome-message');
            if (welcomeMsg) {
                welcomeMsg.remove();
            }

            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showLoading() {
            const messagesContainer = document.getElementById('chatMessages');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = 'loadingMessage';
            loadingDiv.innerHTML = '<div class="loading">Thinking</div>';
            messagesContainer.appendChild(loadingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function removeLoading() {
            const loading = document.getElementById('loadingMessage');
            if (loading) {
                loading.remove();
            }
        }

        function showError(message) {
            const messagesContainer = document.getElementById('chatMessages');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'message assistant';
            errorDiv.innerHTML = `<div class="message-content"><div class="error-message">${message}</div></div>`;
            messagesContainer.appendChild(errorDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function sendMessage() {
            if (isLoading) return;

            const input = document.getElementById('chatInput');
            const sendButton = document.getElementById('sendButton');
            const query = input.value.trim();

            if (!query) return;

            // Update UI
            input.value = '';
            sendButton.disabled = true;
            isLoading = true;

            // Add user message
            addMessage(query, true);

            // Show loading
            showLoading();

            try {
                const payload = { query: query };
                if (sessionId) {
                    payload.session_id = sessionId;
                }

                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                removeLoading();

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to get response');
                }

                const data = await response.json();

                if (data.response) {
                    addMessage(data.response, false);
                    sessionId = data.session_id;  // Store session ID
                } else {
                    throw new Error('No response received');
                }

            } catch (error) {
                removeLoading();
                console.error('Error:', error);
                showError('Sorry, there was an error processing your request. Please try again.');
            } finally {
                sendButton.disabled = false;
                isLoading = false;
                input.focus();
            }
        }

        function sendStarterQuestion(question) {
            // Set the input value and send
            document.getElementById('chatInput').value = question;
            sendMessage();

            // Hide starter questions after first use
            const starterQuestions = document.getElementById('starterQuestions');
            if (starterQuestions) {
                starterQuestions.style.display = 'none';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Voice input functionality
        let recognition = null;
        let isListening = false;

        function toggleVoiceInput() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Voice input is not supported in your browser. Try Chrome, Edge, or Safari.');
                return;
            }

            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            const micButton = document.getElementById('micButton');
            const micIcon = document.getElementById('micIcon');

            recognition.onstart = () => {
                isListening = true;
                micButton.classList.add('listening');
                micIcon.setAttribute('data-lucide', 'mic-off');
                lucide.createIcons();
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('chatInput').value = transcript;
                stopListening();
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                stopListening();
                if (event.error === 'not-allowed') {
                    alert('Microphone access denied. Please enable microphone permissions.');
                }
            };

            recognition.onend = () => {
                stopListening();
            };

            recognition.start();
        }

        function stopListening() {
            if (recognition) {
                recognition.stop();
            }
            isListening = false;
            const micButton = document.getElementById('micButton');
            const micIcon = document.getElementById('micIcon');
            micButton.classList.remove('listening');
            micIcon.setAttribute('data-lucide', 'mic');
            lucide.createIcons();
        }

        // Copy message functionality
        function copyMessage(content, button) {
            // Remove markdown formatting for plain text copy
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = marked.parse(content);
            const plainText = tempDiv.textContent || tempDiv.innerText;

            navigator.clipboard.writeText(plainText).then(() => {
                const originalHTML = button.innerHTML;
                button.innerHTML = '<i data-lucide="check" style="width: 14px; height: 14px;"></i> Copied';
                button.classList.add('success');
                lucide.createIcons();

                setTimeout(() => {
                    button.innerHTML = originalHTML;
                    button.classList.remove('success');
                    lucide.createIcons();
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy message');
            });
        }

        // Share message functionality
        function shareMessage(content) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = marked.parse(content);
            const plainText = tempDiv.textContent || tempDiv.innerText;

            const shareData = {
                title: 'SpiritDAO Knowledge Assistant',
                text: plainText,
                url: window.location.href
            };

            if (navigator.share) {
                navigator.share(shareData).catch(err => {
                    if (err.name !== 'AbortError') {
                        console.error('Share failed:', err);
                    }
                });
            } else {
                // Fallback: copy to clipboard
                navigator.clipboard.writeText(plainText).then(() => {
                    alert('Response copied to clipboard!');
                }).catch(err => {
                    console.error('Failed to copy:', err);
                });
            }
        }

        // Initialize Lucide icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }

        // Focus input on load
        document.getElementById('chatInput').focus();
    </script>
</body>
</html>
