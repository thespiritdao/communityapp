# Automated Supabase Database Backup Workflow
#
# This workflow creates daily backups of your Supabase database
# Backups are stored in a private repository for security
#
# Setup Required:
# 1. Create a PRIVATE GitHub repository for backups (e.g., spiritdao/database-backups-private)
# 2. Generate a GitHub Personal Access Token with 'repo' scope
# 3. Add the following secrets to your repository:
#    - SUPABASE_DB_URL: postgresql://postgres:[PASSWORD]@db.yqgqodofeliuurrmxlks.supabase.co:5432/postgres
#    - BACKUP_REPO_TOKEN: Your GitHub Personal Access Token
#    - BACKUP_REPO: Your backup repository (e.g., spiritdao/database-backups-private)

name: Automated Database Backup

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      backup_type:
        description: 'Backup type'
        required: false
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - manual
          - pre-deployment

  # Backup before production deployments
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

jobs:
  backup:
    runs-on: ubuntu-latest

    env:
      BACKUP_DATE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.backup_type || 'scheduled' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create backup directory
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_DIR="backups/${TIMESTAMP}"
          mkdir -p "${BACKUP_DIR}"
          echo "BACKUP_DIR=${BACKUP_DIR}" >> $GITHUB_ENV
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

      - name: Backup database roles
        run: |
          supabase db dump \
            --db-url "${{ secrets.SUPABASE_DB_URL }}" \
            -f "${BACKUP_DIR}/roles.sql" \
            --role-only
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Backup database schema
        run: |
          supabase db dump \
            --db-url "${{ secrets.SUPABASE_DB_URL }}" \
            -f "${BACKUP_DIR}/schema.sql"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Backup database data
        run: |
          supabase db dump \
            --db-url "${{ secrets.SUPABASE_DB_URL }}" \
            -f "${BACKUP_DIR}/data.sql" \
            --use-copy \
            --data-only
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Create backup metadata
        run: |
          cat > "${BACKUP_DIR}/metadata.json" << EOF
          {
            "timestamp": "${TIMESTAMP}",
            "date": "$(date -u +"%Y-%m-%d %H:%M:%S UTC")",
            "trigger": "${{ github.event_name }}",
            "backup_type": "${BACKUP_DATE}",
            "git_sha": "${{ github.sha }}",
            "git_branch": "${{ github.ref_name }}",
            "actor": "${{ github.actor }}",
            "workflow_run_id": "${{ github.run_id }}"
          }
          EOF

      - name: Create restore script
        run: |
          cat > "${BACKUP_DIR}/restore.sh" << 'EOF'
          #!/bin/bash
          # Automated Restore Script for Supabase Database
          #
          # Usage: ./restore.sh [CONNECTION_STRING]
          # Example: ./restore.sh "postgresql://postgres:password@db.ref.supabase.co:5432/postgres"
          #
          # IMPORTANT: Test on staging environment first!

          set -e

          if [ -z "$1" ]; then
            echo "Error: Connection string required"
            echo "Usage: $0 [CONNECTION_STRING]"
            exit 1
          fi

          CONNECTION_STRING="$1"

          echo "⚠️  WARNING: This will restore the database to the backup from:"
          cat metadata.json | grep -E "date|backup_type" | sed 's/^/  /'
          echo ""
          echo "Press Ctrl+C to cancel, or press Enter to continue..."
          read -r

          echo "🔄 Starting database restore..."

          psql \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --file roles.sql \
            --file schema.sql \
            --command 'SET session_replication_role = replica' \
            --file data.sql \
            --dbname "${CONNECTION_STRING}"

          echo "✅ Database restore completed successfully!"
          echo "📋 Verify your application is working correctly"
          EOF

          chmod +x "${BACKUP_DIR}/restore.sh"

      - name: Create backup archive
        run: |
          cd backups
          tar -czf "${TIMESTAMP}.tar.gz" "${TIMESTAMP}"
          echo "ARCHIVE_FILE=${TIMESTAMP}.tar.gz" >> $GITHUB_ENV

      - name: Push to backup repository
        if: success()
        run: |
          # Clone backup repository
          git clone "https://${{ secrets.BACKUP_REPO_TOKEN }}@github.com/${{ secrets.BACKUP_REPO }}.git" backup-repo

          cd backup-repo

          # Create monthly directory structure
          MONTH=$(date +%Y-%m)
          mkdir -p "backups/${MONTH}"

          # Copy backup files
          cp -r "../${BACKUP_DIR}" "backups/${MONTH}/"
          cp "../backups/${ARCHIVE_FILE}" "backups/${MONTH}/"

          # Configure git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Commit and push
          git add .
          git commit -m "Automated backup: ${TIMESTAMP} (${BACKUP_DATE})"
          git push
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}

      - name: Cleanup old backups (keep last 7 days locally)
        if: github.event_name == 'schedule'
        run: |
          find backups -name "*.tar.gz" -mtime +7 -delete || true

      - name: Upload backup artifacts (7 day retention)
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ env.TIMESTAMP }}
          path: backups/${{ env.TIMESTAMP }}
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Database backup failed!"
          echo "Workflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Backup summary
        if: success()
        run: |
          echo "✅ Database backup completed successfully!"
          echo "Timestamp: ${TIMESTAMP}"
          echo "Backup Type: ${BACKUP_DATE}"
          echo "Files created:"
          ls -lh "${BACKUP_DIR}"
          echo ""
          echo "Archive size:"
          ls -lh "backups/${ARCHIVE_FILE}"
